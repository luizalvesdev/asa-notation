AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: asa-notation (Lambda + HTTP API + Neon)

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    Timeout: 30
    MemorySize: 256

Parameters:
  DatabaseUrlParam:
    Type: String
    Default: /asa/prod/neon/database-url
    Description: Nome (não o valor) do parâmetro SecureString com a connection string do Neon
  SessionSecretParam:
    Type: String
    Default: /asa/prod/auth/session-secret
    Description: Nome do parâmetro SecureString com o segredo que assina sessões (mínimo 32 caracteres)
  BootstrapTokenParam:
    Type: String
    Default: /asa/prod/auth/bootstrap-token
    Description: Nome do parâmetro SecureString com o token do primeiro cadastro de passkey (mínimo 24 caracteres)
  RpId:
    Type: String
    Default: localhost
    Description: Domínio da passkey (RP ID). Trocar invalida as passkeys já cadastradas
  RpName:
    Type: String
    Default: asa-notation
  AllowedOrigins:
    Type: String
    Default: http://localhost:5173
    Description: Origens do app web, separadas por vírgula

Resources:
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 30

  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Target: es2022
        Sourcemap: false
        Banner:
          - js=import { createRequire } from 'node:module'; const require = createRequire(import.meta.url);
        EntryPoints: [apps/api/src/handler.ts]
        OutExtension: [.js=.mjs]
    Properties:
      Handler: handler.handler
      CodeUri: .
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup
      Environment:
        Variables:
          DATABASE_URL_PARAM: !Ref DatabaseUrlParam
          SESSION_SECRET_PARAM: !Ref SessionSecretParam
          BOOTSTRAP_TOKEN_PARAM: !Ref BootstrapTokenParam
          RP_ID: !Ref RpId
          RP_NAME: !Ref RpName
          ALLOWED_ORIGINS: !Ref AllowedOrigins
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:GetParameters
              Resource:
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DatabaseUrlParam}"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SessionSecretParam}"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${BootstrapTokenParam}"
      Events:
        AnyRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: ANY
            Path: /{proxy+}

Outputs:
  ApiUrl:
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com"

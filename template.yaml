AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: asa-notation (Lambda + HTTP API + Neon)

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    Timeout: 30
    MemorySize: 256

Parameters:
  DatabaseUrlParam:
    Type: String
    Default: /asa/prod/neon/database-url
    Description: Nome (não o valor) do parâmetro SecureString com a connection string do Neon
  SessionSecretParam:
    Type: String
    Default: /asa/prod/auth/session-secret
    Description: Nome do parâmetro SecureString com o segredo que assina sessões (mínimo 32 caracteres)
  AiProvider:
    Type: String
    Default: anthropic
    AllowedValues: [anthropic, bedrock]
    Description: anthropic usa a chave guardada no app (Configurações > Assistentes); bedrock usa o papel IAM da Lambda, sem chave
  AnthropicModel:
    Type: String
    Default: claude-haiku-5-5
    Description: Modelo na API da Anthropic (só com AiProvider=anthropic)
  AnthropicEffort:
    Type: String
    Default: ""
    AllowedValues: ["", low, medium, high, xhigh, max]
    Description: Quanto o modelo pensa (output_config.effort). Vazio usa o padrão do modelo
  BedrockModelId:
    Type: String
    Default: ""
    Description: ID do modelo ou do perfil de inferência no Bedrock (obrigatório quando AiProvider=bedrock). Testado com global.anthropic.claude-haiku-4-5-20251001-v1:0 (mais barato) e global.anthropic.claude-sonnet-4-6
  AllowedOrigins:
    Type: String
    Default: http://localhost:5173
    Description: Origens do app web, separadas por vírgula

  DomainName:
    Type: String
    Default: ""
    Description: Domínio próprio do app (ex. asa.luizalves.dev). Vazio usa só o endereço do CloudFront
  CertificateArn:
    Type: String
    Default: ""
    Description: Certificado do ACM em us-east-1 para o domínio (obrigatório com DomainName)

  PushSchedule:
    Type: String
    # De 7:00 a 22:30 em Brasília (UTC-3), de meia em meia hora: o horário de silêncio padrão já cobre o resto.
    # Cada execução acorda o Neon (~5 min ligado): ~16 h de compute por mês, contra ~60 h a cada 15 min o dia todo.
    Default: cron(0,30 10-23,0-1 * * ? *)
    Description: Quando o servidor gera os check-ins vencidos e manda por Web Push (expressão do EventBridge, em UTC)

Conditions:
  UseBedrock: !Equals [!Ref AiProvider, bedrock]
  UseDomain: !And [!Not [!Equals [!Ref DomainName, ""]], !Not [!Equals [!Ref CertificateArn, ""]]]

Resources:
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  # Disparos exatos do push: um agendamento de uma vez só por minuto em que algo deve avisar (some sozinho depois de rodar).
  FireGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Properties:
      Name: !Sub "${AWS::StackName}-fire"

  FireRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: invoke-api
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                # Curinga no nome (a função tem nome gerado) para o papel não depender da função, que depende dele.
                Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-ApiFunction-*"

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 30

  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Target: es2022
        Sourcemap: false
        Banner:
          - js=import { createRequire } from 'node:module'; const require = createRequire(import.meta.url);
        EntryPoints: [apps/api/src/handler.ts]
        OutExtension: [.js=.mjs]
    Properties:
      Handler: handler.handler
      CodeUri: .
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup
      Environment:
        Variables:
          DATABASE_URL_PARAM: !Ref DatabaseUrlParam
          SESSION_SECRET_PARAM: !Ref SessionSecretParam
          ALLOWED_ORIGINS: !Ref AllowedOrigins
          AI_PROVIDER: !Ref AiProvider
          ANTHROPIC_MODEL: !Ref AnthropicModel
          ANTHROPIC_EFFORT: !Ref AnthropicEffort
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          # Disparos exatos do push (tarefas com hora, check-ins): o grupo e o papel que o agendador usa para chamar esta função.
          FIRE_GROUP: !Ref FireGroup
          FIRE_ROLE_ARN: !GetAtt FireRole.Arn
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:GetParameters
              Resource:
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DatabaseUrlParam}"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SessionSecretParam}"
        # Criar, listar e apagar os disparos exatos (o agendador assume FireRole para chamar a função).
        - Statement:
            - Effect: Allow
              Action:
                - scheduler:CreateSchedule
                - scheduler:DeleteSchedule
              Resource: !Sub "arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/${FireGroup}/*"
            - Effect: Allow
              Action: scheduler:ListSchedules
              Resource: "*"
            - Effect: Allow
              Action: iam:PassRole
              Resource: !GetAtt FireRole.Arn
        # Só com AiProvider=bedrock: permite chamar o modelo (modelos e perfis de inferência de qualquer região).
        - !If
          - UseBedrock
          - Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/*"
                  - !Sub "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*"
          - !Ref AWS::NoValue
      Events:
        AnyRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: ANY
            Path: /{proxy+}
        # Check-ins e lembretes com o app fechado: gera o que venceu e manda por Web Push.
        PushJob:
          Type: Schedule
          Properties:
            Schedule: !Ref PushSchedule
            Input: '{"job":"push"}'

  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-web"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Cabeçalhos de segurança do app (a API usa a política gerenciada). A CSP libera só o que o app usa:
  # scripts do próprio domínio, fontes do Google Fonts, imagens https (capas e imagens por URL) e a API no mesmo domínio.
  WebHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-web-headers"
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: "camera=(), microphone=(), geolocation=(), payment=()"
              Override: true

  # App e API no mesmo domínio: o cookie de sessão fica first-party.
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: asa-notation
        Aliases: !If [UseDomain, [!Ref DomainName], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - UseDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - !Ref AWS::NoValue
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_All
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: api
            DomainName: !Sub "${Api}.execute-api.${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref WebHeadersPolicy
        CacheBehaviors:
          # O service worker não pode ficar em cache no CDN: uma versão nova precisa chegar logo.
          - PathPattern: /sw.js
            TargetOriginId: web
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            ResponseHeadersPolicyId: !Ref WebHeadersPolicy
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

Outputs:
  ApiUrl:
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com"
  AppUrl:
    Value: !Sub "https://${Distribution.DomainName}"
  DistributionDomain:
    Value: !GetAtt Distribution.DomainName
  DistributionId:
    Value: !Ref Distribution
  WebBucketName:
    Value: !Ref WebBucket
